<h1>Office 实时编辑器</h1><p>通过智能体或本机命令打开 Word、Excel、PPT 文件，即可直接编辑并保存回原文件。</p>
<p>请先运行 <code>office_live.py open "文件路径"</code>，再打开命令返回的编辑链接。</p>
<p>编辑器与智能体共享同一个会话；保存前保留备份，检测到外部修改时暂停写回。</p>
