[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "microsoft-wps-live-mcp"
version = "0.3.0"
description = "Local MCP tools for live Microsoft Office and WPS Office documents on Windows and macOS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "pywin32>=308; sys_platform == 'win32'",
]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]

[project.scripts]
microsoft-wps-live-mcp = "microsoft_wps_live_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

